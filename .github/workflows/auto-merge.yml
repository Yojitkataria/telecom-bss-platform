
name: Auto Merge PR



on:

pull_request:

types: [opened, labeled, review_submitted]



jobs:

automerge:

runs-on: ubuntu-latest

steps:

  - name: Enable GitHub Auto-merge

    uses: alexwilson/enable-github-automerge-action@v1.0.0

    with:

      github-token: ${{ secrets.GITHUB_TOKEN }}

      merge-method: SQUASH

