name: CI & AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to the same PR cancels the older run
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job 1: build and test. The real quality gate.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: telecom_bss
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Maven Project
        run: |
          chmod +x mvnw
          ./mvnw -B clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/telecom_bss
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci_password
          DB_PASSWORD: ci_password
          JWT_SECRET: ci-only-secret-key-at-least-32-bytes-long!!

  # Job 2: AI review. Separate, so an AI outage never blocks the build.
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: PR Agent Code Review
        uses: the-pr-agent/pr-agent@main
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use a model name that is currently available in Google AI Studio
          config.model: "gemini/gemini-2.5-flash"
          config.fallback_models: '["gemini/gemini-2.5-flash"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"

  # Job 3: gate. Fails the PR if the AI labelled it with a security concern.
  # Make this check "required" in branch protection to actually block merging.
  ai-gate:
    needs: ai-review
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read

    steps:
      - name: Fail on security label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              }
            );
            const names = labels.map(l => l.name);
            core.info('Labels on PR: ' + names.join(', '));
            if (names.includes('Possible security concern')) {
              core.setFailed('AI review flagged a possible security concern. Fix it, or remove the label if it is a false positive.');
            }
