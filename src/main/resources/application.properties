spring.application.name=telecom-bss
server.port=8080

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/telecom_bss?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=bss_user
spring.datasource.password=bss_password

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Jwt secret
# JWT Configuration
jwt.secret=local-development-secret-key-must-be-at-least-32-bytes-long!!
jwt.expiration-ms=86400000