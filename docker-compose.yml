version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: telecom-mysql
    environment:
      MYSQL_DATABASE: telecom_bss
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: telecom-bss-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/telecom_bss?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      - mysql-db

volumes:
  mysql_data: